name: RevPilot CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy example configuration
        run: cp .env.example .env

      - name: Run Test Suite
        run: pytest -v

      - name: Run Benchmark Verification
        run: python -m scripts.run_benchmark --records 500 --seed 20260821

      - name: Run Chaos Engineering Suite
        run: python -m scripts.run_chaos_suite

